<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>머니룸 - 나만의 자산 관리</title>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    
    <div class="money-room-container">
        <!-- 📌 상단 공통 헤더 컨테이너 -->
        <div id="header-container"></div>

        <!-- 💰 현재 총 자산 요약 구역 (파스텔 그라데이션 + 3D 저금통 일러스트) -->
        <div class="total-asset-box">
            <div class="total-asset-left">
                <div class="title-row">
                    <div class="title">
                        <svg viewBox="0 0 24 24"><path d="M19 14V6c0-1.1-.9-2-2-2H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zm-9-1c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm13-6v11c0 1.1-.9 2-2 2H4v-2h17V7h2z"/></svg>
                        현재 총 자산
                    </div>
                    <button type="button" onclick="window.openBaseAssetModal()" class="btn-base-asset-setting" title="기초 자산 설정">
                        ⚙️ 기초자산
                    </button>
                </div>
                <div id="total-asset-amount" class="amount privacy-mask" title="살짝 대거나 터치하면 금액이 표시됩니다">0원</div>

                <!-- 🎯 자산 배분 구조 요약 정보 바 -->
                <div class="asset-allocation-box">
                    <div id="allocation-stat-row" class="allocation-stat-row">
                        <span class="alloc-item">💵 보유현금 <strong id="unallocated-amount">0원</strong></span>
                    </div>
                    <div class="allocation-track">
                        <div id="allocation-bar-fill" class="allocation-bar-fill" style="width: 0%;"></div>
                    </div>
                </div>
            </div>

            <!-- 파스텔 3D 돼지저금통 & 코인 장식 SVG -->
            <svg class="total-asset-piggy" viewBox="0 0 160 140" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="100" cy="85" rx="46" ry="36" fill="#F8FAFC" fill-opacity="0.95"/>
                <ellipse cx="66" cy="88" rx="20" ry="18" fill="#F8FAFC"/>
                <ellipse cx="58" cy="90" rx="7" ry="10" fill="#E2E8F0"/>
                <circle cx="56" cy="88" r="1.8" fill="#94A3B8"/>
                <circle cx="56" cy="92" r="1.8" fill="#94A3B8"/>
                <circle cx="78" cy="80" r="3.2" fill="#475569"/>
                <circle cx="79.5" cy="79" r="1" fill="#FFFFFF"/>
                <path d="M85 54C85 54 88 44 96 47C101 49 99 58 99 58" fill="#E2E8F0"/>
                <path d="M72 58C72 58 68 48 75 47C80 46 82 56 82 56" fill="#E2E8F0"/>
                <rect x="80" y="112" width="12" height="16" rx="6" fill="#E2E8F0"/>
                <rect x="108" y="112" width="12" height="16" rx="6" fill="#E2E8F0"/>
                <circle cx="118" cy="38" r="16" fill="#FDE047"/>
                <circle cx="118" cy="38" r="13" fill="#FACC15" stroke="#EAB308" stroke-width="1.5"/>
                <text x="118" y="43" font-size="13" font-weight="900" fill="#854D0E" text-anchor="middle">₩</text>
                <path d="M142 34L148 36L142 38L140 44L138 38L132 36L138 34L140 28L142 34Z" fill="#FEF08A"/>
            </svg>
        </div>

        <!-- [+ 자산 추가] 파스텔 오픈 버튼 -->
        <button onclick="window.openModal()" class="btn-open-modal">
            <span class="plus-circle">+</span>
            새로운 자산/목표 추가하기
        </button>

        <!-- 📑 목표 진행 필터 탭 (진행중 / 완료) -->
        <div class="filter-tabs">
            <button type="button" class="filter-btn active" id="tab-ongoing" onclick="window.setGoalTab('ongoing')">진행중</button>
            <button type="button" class="filter-btn" id="tab-completed" onclick="window.setGoalTab('completed')">완료</button>
        </div>

        <!-- 기초 자산 설정 모달 -->
        <div id="base-asset-modal" class="modal-overlay">
            <div class="modal-content">
                <h2>기초 자산(초기 자본) 설정</h2>
                <p class="modal-desc-sub">머니룸 기록 시작 전 보유하고 계신 기초 자본금을 입력해주세요.<br>누적 월별 수지(총 수입 - 일반 지출)와 합산되어 총 자산이 계산됩니다.</p>
                <div class="form-group">
                    <input type="number" id="base-asset-input" placeholder="기초 자산 금액 (원)">
                </div>
                <div class="modal-buttons">
                    <button onclick="window.handleSaveBaseAsset()" class="btn-primary">저장</button>
                    <button onclick="window.closeBaseAssetModal()" class="btn-close">취소</button>
                </div>
            </div>
        </div>

        <!-- 팝업 모달 -->
        <div id="add-modal" class="modal-overlay">
            <div class="modal-content">
                <h2>새로운 자산/목표 추가</h2>
                <div class="form-group">
                    <input type="text" id="new-category-name" placeholder="항목 이름 (예: 비상금, 주식, 결혼자금)">
                    <input type="number" id="new-target-amount" placeholder="목표 금액 (원)">
                </div>
                <div class="modal-buttons">
                    <button onclick="window.handleAddCategory()" class="btn-primary">추가</button>
                    <button onclick="window.closeModal()" class="btn-close">취소</button>
                </div>
            </div>
        </div>

        <!-- 자산 카드 리스트 구역 -->
        <div id="category-container">
            <p style="color: #94a3b8; text-align: center;">데이터를 불러오는 중...</p>
        </div>
    </div>

    <!-- 🧭 하단 공통 네비게이션 컨테이너 -->
    <div id="navbar-container"></div>

    <!-- 🧭 공통 컴포넌트(헤더 & 하단 네비게이션) 로드 -->
    <script type="module" src="./js/components.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
