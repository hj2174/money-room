<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>머니룸 - 월별 수입/지출 정산</title>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    
    <div class="money-room-container">
        <!-- 📅 월 선택 컨트롤러 -->
        <div class="month-selector">
            <button id="btn-prev-month" class="btn-month-nav" title="이전 달">&lt;</button>
            <div class="current-month-display" title="클릭하여 원하는 달 선택">
                <span id="month-label">2026년 10월</span>
                <input type="month" id="month-picker" class="month-picker-input">
            </div>
            <button id="btn-next-month" class="btn-month-nav" title="다음 달">&gt;</button>
        </div>

        <!-- 📊 월별 수지 요약 구역 -->
        <div id="flow-summary-box" class="flow-summary-box">
            <div class="title">이달의 잔여 현금 흐름 (수입 - 지출)</div>
            <div id="net-amount" class="main-amount">0원</div>
        </div>

        <!-- 📊 통합 월간 분석 카드: 지난달 비교 & 카테고리별 지출 비중 (한 줄 가로 배치) -->
        <div id="monthly-report-card" class="monthly-report-card">
            <div class="report-row">
                <!-- 좌측: 지난달 비교 -->
                <div class="report-col report-compare-col">
                    <div class="compare-header">
                        <span class="compare-title">⚖️ 지난달 비교</span>
                        <span id="compare-prev-month-label" class="compare-prev-month">전월 대비</span>
                    </div>
                    <div id="compare-content" class="compare-content">
                        <span>데이터를 불러오는 중...</span>
                    </div>
                </div>

                <!-- 중앙 세로 구분선 -->
                <div class="report-v-divider"></div>

                <!-- 우측: 카테고리별 지출 비중 -->
                <div class="report-col report-chart-col">
                    <div class="chart-col-header">
                        <span class="chart-card-title">📊 지출 비중</span>
                        <button type="button" id="btn-toggle-chart-detail" class="btn-toggle-detail" onclick="window.toggleChartDetail()">
                            <span>상세</span>
                            <svg class="icon-toggle-arrow" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                        </button>
                    </div>
                    <div id="chart-graph-wrap" class="chart-graph-wrap">
                        <div class="chart-empty-message">분석 중...</div>
                    </div>
                </div>
            </div>

            <!-- 하단: 상세 보기 클릭 시 한 줄 아래로 펼쳐지는 카테고리별 리스트 -->
            <div id="chart-legend-container" class="chart-legend-list"></div>
        </div>

        <!-- [+ 내역 추가] 오픈 버튼 -->
        <button onclick="window.openModal()" class="btn-open-modal">
            <span class="plus-circle">+</span>
            수입/지출 내역 추가하기
        </button>

        <!-- 📑 내역 필터 탭 (전체 / 수입 / 지출) -->
        <div class="filter-tabs">
            <button class="filter-btn active" id="filter-all" onclick="window.setFilter('all')">전체</button>
            <button class="filter-btn" id="filter-income" onclick="window.setFilter('income')">수입</button>
            <button class="filter-btn" id="filter-expense" onclick="window.setFilter('expense')">지출</button>
        </div>

        <!-- 수입/지출 내역 리스트 구역 -->
        <div id="record-container" class="record-list">
            <p style="color: #9ca3af; text-align: center;">내역을 불러오는 중...</p>
        </div>

        <!-- 팝업 모달 1: 수입/지출 추가/수정 -->
        <div id="add-modal" class="modal-overlay">
            <div class="modal-content">
                <h2 id="modal-title">수입/지출 내역 추가</h2>
                
                <!-- 수입/지출 구분 버튼 -->
                <div class="type-selector">
                    <button type="button" id="type-expense-btn" class="type-btn active expense" onclick="window.selectType('expense')">지출 (-)</button>
                    <button type="button" id="type-income-btn" class="type-btn" onclick="window.selectType('income')">수입 (+)</button>
                </div>

                <!-- ⚡ 빠른 템플릿 (퀵 칩 버튼) -->
                <div class="template-section">
                    <div class="template-header">
                        <span class="template-title">⚡ 자주 쓰는 템플릿</span>
                        <button type="button" onclick="window.openTemplateManager()" class="btn-manage-template">⚙️ 템플릿 직접 설정</button>
                    </div>
                    <div id="template-chips" class="template-chips-wrap">
                        <!-- 동적으로 렌더링됨 -->
                    </div>
                </div>

                <!-- 🎯 자산 목표 연동 (저축성 지출/적립) -->
                <div class="asset-link-section">
                    <label for="target-link-select" class="asset-link-label">
                        <span>🎯 자산 목표 연동 / 저축성 배분 (선택)</span>
                    </label>
                    <select id="target-link-select" class="asset-link-select" onchange="window.handleTargetLinkChange(this.value)">
                        <option value="">-- 연동 안 함 (일반 생활 내역) --</option>
                    </select>
                    <div id="asset-link-tip" class="asset-link-tip"></div>
                </div>

                <div class="form-group">
                    <input type="text" id="new-category" placeholder="항목 이름 (예: 식비, 월급, 쇼핑)">
                    <input type="number" id="new-amount" placeholder="금액 (원)">
                    <input type="text" id="new-memo" placeholder="메모 (선택사항)">
                </div>
                <div class="modal-buttons">
                    <button id="modal-submit-btn" onclick="window.handleSubmitRecord()" class="btn-primary">추가</button>
                    <button onclick="window.closeModal()" class="btn-close">취소</button>
                </div>
            </div>
        </div>

        <!-- 팝업 모달 2: 템플릿 직접 관리/설정 -->
        <div id="template-manage-modal" class="modal-overlay">
            <div class="modal-content modal-template-content">
                <div class="modal-copy-header">
                    <h2>자주 쓰는 템플릿 설정</h2>
                    <p class="modal-copy-subtitle">나만의 고정 수입/지출 항목과 금액을 직접 등록하세요.</p>
                </div>

                <!-- 템플릿 타입 탭 -->
                <div class="type-selector" style="margin-bottom: 10px;">
                    <button type="button" id="tmpl-tab-expense" class="type-btn active expense" onclick="window.switchTemplateTab('expense')">지출 템플릿</button>
                    <button type="button" id="tmpl-tab-income" class="type-btn" onclick="window.switchTemplateTab('income')">수입 템플릿</button>
                </div>

                <!-- 템플릿 추가 폼 -->
                <div class="template-add-form">
                    <div class="template-add-inputs">
                        <input type="text" id="tmpl-input-icon" class="template-input-icon" placeholder="이모지" value="📌" maxlength="2">
                        <input type="text" id="tmpl-input-name" class="template-input-name" placeholder="항목 이름 (예: 통신비)">
                        <input type="number" id="tmpl-input-amount" class="template-input-amount" placeholder="기본 금액 (원)">
                    </div>
                    <button type="button" onclick="window.handleAddNewTemplate()" class="btn-add-template">+ 새 템플릿 등록</button>
                </div>

                <!-- 등록된 템플릿 목록 -->
                <div id="template-manage-list" class="template-manage-list">
                    <!-- 템플릿 항목들이 동적으로 렌더링됨 -->
                </div>

                <button type="button" onclick="window.handleResetTemplates()" class="btn-template-reset">🔄 기본 템플릿으로 초기화</button>

                <div class="modal-buttons">
                    <button type="button" onclick="window.closeTemplateManager()" class="btn-primary">완료</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 📱 모바일 어플 하단 고정 네비게이션 바 -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </span>
            <span class="bottom-nav-label">자산/목표</span>
        </a>
        <a href="history.html" class="bottom-nav-item active">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
            </span>
            <span class="bottom-nav-label">월별 수지</span>
        </a>
        <a href="room.html" class="bottom-nav-item">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </span>
            <span class="bottom-nav-label">머니룸</span>
        </a>
    </nav>

    <script type="module" src="./js/history.js"></script>
</body>
</html>
