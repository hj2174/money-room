<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>머니룸 - 월별 수입/지출 정산</title>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    
    <div class="money-room-container">
        <!-- 📅 월 선택 컨트롤러 -->
        <div class="month-selector">
            <button id="btn-prev-month" class="btn-month-nav" title="이전 달">&lt;</button>
            <div class="current-month-display" title="클릭하여 원하는 달 선택">
                <span id="month-label">2026년 10월</span>
                <input type="month" id="month-picker" class="month-picker-input">
            </div>
            <button id="btn-next-month" class="btn-month-nav" title="다음 달">&gt;</button>
        </div>

        <!-- 📊 월별 수지 요약 구역 -->
        <div id="flow-summary-box" class="flow-summary-box">
            <div class="title">이달의 잔여 현금 흐름 (수입 - 지출)</div>
            <div id="net-amount" class="main-amount">0원</div>
            <div class="flow-grid">
                <div class="flow-item">
                    <div class="label">총 수입</div>
                    <div id="total-income" class="value">0원</div>
                </div>
                <div class="flow-item">
                    <div class="label">총 지출</div>
                    <div id="total-expense" class="value">0원</div>
                </div>
            </div>
        </div>

        <!-- 🔄 지난달 대비 비교 구역 -->
        <div id="compare-box" class="compare-box">
            <div class="compare-header">
                <span class="compare-title">⚖️ 지난달 비교</span>
                <span id="compare-prev-month-label" class="compare-prev-month">지난달 대비</span>
            </div>
            <div id="compare-content" class="compare-content">
                <span>데이터를 불러오는 중...</span>
            </div>
        </div>

        <!-- 📊 카테고리별 지출 비중 시각화 카드 -->
        <div id="expense-chart-box" class="expense-chart-card">
            <div class="chart-card-header">
                <span class="chart-card-title">📊 카테고리별 지출 비중</span>
                <span id="chart-total-expense" class="chart-card-total">0원</span>
            </div>
            <div id="chart-card-body" class="chart-card-body">
                <div class="chart-empty-message">지출 내역을 분석하는 중...</div>
            </div>
        </div>

        <!-- 액션 버튼 영역 (내역 추가 & 전달 내역 가져오기) -->
        <div class="history-action-buttons">
            <button onclick="window.openModal()" class="btn-open-modal">
                <span class="plus-circle">+</span>
                내역 추가
            </button>
            <button onclick="window.openCopyModal()" class="btn-open-modal btn-copy-action">
                <span class="copy-circle">📋</span>
                전달 내역 가져오기
            </button>
        </div>

        <!-- 📑 내역 필터 탭 (전체 / 수입 / 지출) -->
        <div class="filter-tabs">
            <button class="filter-btn active" id="filter-all" onclick="window.setFilter('all')">전체</button>
            <button class="filter-btn" id="filter-income" onclick="window.setFilter('income')">수입</button>
            <button class="filter-btn" id="filter-expense" onclick="window.setFilter('expense')">지출</button>
        </div>

        <!-- 수입/지출 내역 리스트 구역 -->
        <div id="record-container" class="record-list">
            <p style="color: #9ca3af; text-align: center;">내역을 불러오는 중...</p>
        </div>

        <!-- 팝업 모달 1: 수입/지출 추가/수정 -->
        <div id="add-modal" class="modal-overlay">
            <div class="modal-content">
                <h2 id="modal-title">수입/지출 내역 추가</h2>
                
                <!-- 수입/지출 구분 버튼 -->
                <div class="type-selector">
                    <button type="button" id="type-expense-btn" class="type-btn active expense" onclick="window.selectType('expense')">지출 (-)</button>
                    <button type="button" id="type-income-btn" class="type-btn" onclick="window.selectType('income')">수입 (+)</button>
                </div>

                <!-- ⚡ 빠른 템플릿 (퀵 칩 버튼) -->
                <div class="template-section">
                    <div class="template-header">
                        <span class="template-title">⚡ 자주 쓰는 템플릿</span>
                    </div>
                    <div id="template-chips" class="template-chips-wrap">
                        <!-- 동적으로 렌더링됨 -->
                    </div>
                </div>

                <div class="form-group">
                    <input type="text" id="new-category" placeholder="항목 이름 (예: 식비, 월급, 쇼핑)">
                    <input type="number" id="new-amount" placeholder="금액 (원)">
                    <input type="text" id="new-memo" placeholder="메모 (선택사항)">
                </div>
                <div class="modal-buttons">
                    <button id="modal-submit-btn" onclick="window.handleSubmitRecord()" class="btn-primary">추가</button>
                    <button onclick="window.closeModal()" class="btn-close">취소</button>
                </div>
            </div>
        </div>

        <!-- 팝업 모달 2: 전달 내역 가져오기 (고정비/반복 내역 복사) -->
        <div id="copy-modal" class="modal-overlay">
            <div class="modal-content modal-copy-content">
                <div class="modal-copy-header">
                    <h2>전달 내역 가져오기</h2>
                    <p id="copy-modal-subtitle" class="modal-copy-subtitle">지난달 등록된 내역을 이번 달로 일괄 복사합니다.</p>
                </div>

                <div class="copy-select-all-wrap">
                    <label class="custom-checkbox-label">
                        <input type="checkbox" id="copy-check-all" onchange="window.toggleAllCopyChecks(this.checked)" checked>
                        <span>전체 선택</span>
                    </label>
                    <span id="copy-selected-count" class="copy-count-badge">0개 선택</span>
                </div>

                <div id="copy-item-list" class="copy-item-list">
                    <!-- 이전 달 내역들이 체크박스와 함께 렌더링됨 -->
                </div>

                <div class="modal-buttons">
                    <button id="btn-submit-copy" onclick="window.handleCopyRecords()" class="btn-primary">가져오기</button>
                    <button onclick="window.closeCopyModal()" class="btn-close">취소</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 📱 모바일 어플 하단 고정 네비게이션 바 -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </span>
            <span class="bottom-nav-label">자산/목표</span>
        </a>
        <a href="history.html" class="bottom-nav-item active">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
            </span>
            <span class="bottom-nav-label">월별 수지</span>
        </a>
        <a href="room.html" class="bottom-nav-item">
            <span class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </span>
            <span class="bottom-nav-label">머니룸</span>
        </a>
    </nav>

    <script type="module" src="./js/history.js"></script>
</body>
</html>
